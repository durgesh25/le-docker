services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./site:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
    volumes:
      - ./site:/var/www/html
    depends_on:
      - db
      - redis

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: change-root-password
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine

  wpcli:
    build:
      context: ./docker/php
    volumes:
      - ./site:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
